version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Each Yarn lockfile belongs to a separate project. Group related security
  # fixes within that project and leave other dependencies individually reviewable.
  # A zero PR limit disables routine npm version updates only.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      library-babel-tooling:
        applies-to: security-updates
        dependency-type: development
        patterns: ['@babel/*']
        exclude-patterns: ['@babel/runtime', '@babel/runtime-*']

  - package-ecosystem: npm
    directory: /codemods
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      codemods-babel:
        applies-to: security-updates
        patterns: ['@babel/*']
